# This repo IS the Next.js app, so there is no `base` setting — Netlify builds
# from the repo root.
#
# The backend it talks to (Express + SQLite) lives in a separate project and is
# NOT deployable to Netlify: Functions are ephemeral with a read-only
# filesystem, and SQLite needs a persistent disk. Point the app at wherever the
# backend actually runs, via NEXT_PUBLIC_BACKEND_URL.

[build]
  command = "npm run build"
  # Must be .next for the Next.js plugin. Set here so it overrides whatever the
  # Netlify UI has (an empty UI value resolves to the repo root, which fails).
  publish = ".next"

[build.environment]
  # Next 16 needs Node 20+; Netlify's default image may be older.
  NODE_VERSION = "22"

# Official Next.js runtime — SSR, route handlers, image optimisation.
# publish is pinned to .next above.
[[plugins]]
  package = "@netlify/plugin-nextjs"
